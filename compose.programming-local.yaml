# LOCAL ONLY. Merge with the existing radio88-feed compose; never use for Production.
services:
  api:
    command: ["sh", "-c", "unset VERCEL_ENV; node dist/src/database/migrate.js && node dist/src/database/seed.js && node dist/src/server.js"]
    environment:
      PROGRAMMING_ENABLED: "true"
      POLLS_ENABLED: "true"
      NODE_ENV: development
      GOOGLE_CALENDAR_AUTO_SYNC_INTERVAL_SECONDS: "300"
      PUBLIC_POLLS_ENABLED: "true"
      POLLS_PUBLIC_LOCAL_ENABLED: "true"
      POLLS_PUBLIC_LOCAL_SNAPSHOT_FILE: /tmp/radio88-polls-local.json
      PROGRAMMING_PUBLICATION_ENABLED: "true"
      PROGRAMMING_NAMESPACE: preview/radio-88
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5181,http://localhost:5181,http://127.0.0.1:8086,http://localhost:8086
  institutional:
    environment:
      VITE_ON_AIR_ENABLED: "true"
      VITE_PROGRAMMING_API_URL: http://127.0.0.1:3012
      FEED_PREVIEW_IMAGE_ID: local-programming-media-20261109
