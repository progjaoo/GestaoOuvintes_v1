name: radio88-feed

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.feed-preview.postgres
    ports:
      - "127.0.0.1:55471:5432"
    volumes:
      - feed-preview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed_preview -d radio88_feed_preview"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: radio88-feed-api:local
    build:
      context: ./api-ouvintes
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.feed-preview.local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
      CORS_ALLOWED_ORIGINS: http://localhost:5181,http://127.0.0.1:5181
      FEED_SITE_BASE_URL: http://institutional:8080
    command:
      - sh
      - -c
      - node dist/src/database/migrate.js && node dist/src/database/seed.js && node dist/src/server.js
    depends_on:
      postgres:
        condition: service_healthy
      institutional:
        condition: service_started
    ports:
      - "127.0.0.1:3012:3010"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12

  panel:
    image: radio88-feed-panel:local
    build:
      context: ./painel-adm
      dockerfile: Dockerfile
      args:
        VITE_CADASTROS_API_URL: http://127.0.0.1:3012
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5181:80"

  institutional:
    image: radio88-feed-institutional:local
    build:
      context: ../institucional
      dockerfile: Dockerfile.feed-preview
      args:
        FEED_RELEASE_BASE_URL: ${R2_PUBLIC_BASE_URL:?set Preview R2 public base URL}
        FEED_NAMESPACE: ${FEED_NAMESPACE:-preview/radio-88}
        FEED_PREVIEW_IMAGE_ID: ${FEED_PREVIEW_IMAGE_ID:?set a local build id}
    restart: unless-stopped
    env_file:
      - .env.feed-preview.site
    environment:
      PORT: 8080
      FEED_NAMESPACE: ${FEED_NAMESPACE:-preview/radio-88}
      FEED_RELEASE_BASE_URL: ${R2_PUBLIC_BASE_URL:?set Preview R2 public base URL}
      FEED_PREVIEW_IMAGE_ID: ${FEED_PREVIEW_IMAGE_ID:?set a local build id}
    volumes:
      - feed-preview-site-data:/data
    ports:
      - "127.0.0.1:8086:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/__preview/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  feed-preview-postgres:
    external: true
    name: radio88-feed_feed-preview-postgres
  feed-preview-site-data:
    name: radio88-feed_feed-preview-site-data
